name: android

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "web/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "web/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: web app
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: signing key
        if: env.KS_BASE64 != ''
        working-directory: apps/desktop/src-tauri/gen/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/conduit-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/conduit-release.jks"
            echo "storePassword=$KS_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: build APK
        working-directory: apps/desktop/src-tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm dlx @tauri-apps/cli@2 android build --apk --ci
      - name: collect
        run: |
          mkdir -p out
          find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-android
          path: out/*.apk
          if-no-files-found: error
