name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: build
        run: |
          go build -o bin/ ./cmd/conduitd
          go build -o bin/ ./cmd/conduit-hub

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web

  desktop:
    name: desktop (${{ matrix.os }})
    needs: [go, web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: web
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: sidecar
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          go build -o "apps/desktop/src-tauri/binaries/conduitd-$TRIPLE$EXT" ./cmd/conduitd
      - name: check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
