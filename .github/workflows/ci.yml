name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: build
        run: |
          go build -o bin/ ./cmd/conduitd
          go build -o bin/ ./cmd/conduit-hub

  hub-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conduit" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/hub/
        env:
          CONDUIT_HUB_TEST_POSTGRES: postgres://conduit:conduit@localhost:5432/conduit?sslmode=disable

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: relay wire format matches Go
        run: pnpm test:relay
        working-directory: web
      - name: every UI string has a German translation
        run: pnpm test:i18n
        working-directory: web

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: site

  desktop:
    name: desktop (${{ matrix.os }})
    needs: [go, web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - name: web
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: sidecar
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          go build -o "apps/desktop/src-tauri/binaries/conduitd-$TRIPLE$EXT" ./cmd/conduitd
      - name: check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/install_test.sh
      - name: install.sh against a fake release
        run: sh scripts/install_test.sh

  databases:
    # The database module against real PostgreSQL and MySQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U conduit" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: conduit
          MYSQL_PASSWORD: conduit
          MYSQL_DATABASE: conduit
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: database module against real servers
        env:
          CONDUIT_TEST_PG: 127.0.0.1:5432
          CONDUIT_TEST_MYSQL: 127.0.0.1:3306
        run: go test -tags dbintegration -v ./modules/database

  e2e:
    # The web app in a real browser against a real daemon, plus automated
    # accessibility checks (web/e2e, docs/architecture/web.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: daemon with the web app
        run: make daemon
      - name: browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: tests
        working-directory: web
        env:
          CI: "1"
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # The hub's Helm chart renders in its main shapes.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: lint and render
        run: |
          helm lint deploy/helm/conduit-hub
          helm template t deploy/helm/conduit-hub > /dev/null
          helm template t deploy/helm/conduit-hub --set database.type=postgres --set database.url=postgres://u@db/conduit \
            --set ingress.enabled=true --set ingress.className=nginx > /dev/null
          ! helm template t deploy/helm/conduit-hub --set database.type=postgres > /dev/null 2>&1

  # Both container images build (amd64; the release builds arm64 too).
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [deploy/daemon/Dockerfile, deploy/hub/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
