openapi: 3.1.0
info:
  title: Conduit Daemon API
  version: 0.1.0
  description: |
    The daemon API exposes every module action, resource and event, plus
    accounts, API keys, approvals, policy, the audit log and panic mode.

    This file is the source of truth. A test in internal/daemon fails if a
    served route is missing here or a documented route is not served, and the
    TypeScript client in web/ is generated from it.

    Authenticate with `Authorization: Bearer <token>`, where the token is a
    session token (`cds_…`) from login, or an API key (`cdt_live_…`,
    `cdt_test_…`, `cdt_agent_…`). Browsers also get an HttpOnly session cookie.
    Every action call still passes the permission policy, whatever the scopes.
servers:
  - url: http://127.0.0.1:7600/api/v1
security:
  - bearer: []
tags:
  - name: remote
  - name: system
  - name: auth
  - name: modules
  - name: audit
  - name: approvals
  - name: policy
  - name: panic
  - name: vault
  - name: automations
  - name: assistant
  - name: keys
  - name: events
  - name: webhooks
  - name: sync
paths:
  /version:
    get:
      operationId: getVersion
      tags: [system]
      summary: Build information of the running daemon
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }

  /setup:
    get:
      operationId: getSetup
      tags: [auth]
      summary: Whether the owner account still needs to be created
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [needsSetup], properties: { needsSetup: { type: boolean } } } } }
    post:
      operationId: setup
      tags: [auth]
      summary: Create the owner account (first start only)
      description: Requires the one-time setup token printed in the daemon log and written to `<data dir>/setup-token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                device: { type: string }
      responses:
        "201": { description: Owner created and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/SessionResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Setup was already completed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                device: { type: string, description: Shown in the session list, e.g. "Pixel 9" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/SessionResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Signed out }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The caller, as the policy sees it
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user, actor, scopes]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  actor: { $ref: "#/components/schemas/Actor" }
                  scopes: { type: array, items: { type: string } }
                  key: { $ref: "#/components/schemas/ApiKey" }

  /me/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password and sign out every other session
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [current, new], properties: { current: { type: string }, new: { type: string, minLength: 10 } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: The caller's active sessions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Session" } } } } }

  /me/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Sign out one session
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Signed out }

  /users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: All local accounts (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
    post:
      operationId: createUser
      tags: [auth]
      summary: Add a local account (admin; signed-in people only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 10 }
                role: { type: string, enum: [admin, member, viewer] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [auth]
      summary: Change someone's role or switch their account off (signed-in people only)
      description: The owner can't be changed or switched off, nobody changes their own account here, and only the owner manages admins. Switching an account off ends its sessions; its keys stop working while it is off.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, member, viewer] }
                disabled: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      tags: [auth]
      summary: Set a new password for someone else and end their sessions (signed-in people only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string, minLength: 10 } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: Installed modules (scope modules:*:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Manifest" } } } } }

  /modules/{id}:
    get:
      operationId: getModule
      tags: [modules]
      summary: One module's manifest
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Manifest" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /instances:
    get:
      operationId: listInstances
      tags: [modules]
      summary: Configured module instances
      parameters:
        - { name: module, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Instance" } } } } }
    post:
      operationId: createInstance
      tags: [modules]
      summary: Configure a new instance of a module (scope instances:*:manage)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InstanceInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Instance" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /instances/{id}:
    get:
      operationId: getInstance
      tags: [modules]
      summary: One instance with its health
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Instance" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateInstance
      tags: [modules]
      summary: Change an instance's name, settings or enabled state
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InstanceInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Instance" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteInstance
      tags: [modules]
      summary: Remove an instance
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /instances/{id}/health:
    get:
      operationId: getInstanceHealth
      tags: [modules]
      summary: Health check of one instance
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }

  /instances/{id}/actions/{action}:
    post:
      operationId: invokeAction
      tags: [modules]
      summary: Call an action (scope actions:<module>:invoke)
      description: |
        Runs through the permission policy. `200` means it ran (or, for a dry
        run, returns the plan). `202` means it is waiting for a person to
        approve; poll `GET /approvals/{id}` and call again once approved.
        People's calls wait for the approval by default; programs' don't.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: action, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input: { description: Action input, matching the action's input schema }
                dryRun: { type: boolean }
                wait: { type: boolean }
      responses:
        "200": { description: Done, content: { application/json: { schema: { $ref: "#/components/schemas/Outcome" } } } }
        "202": { description: Waiting for approval, content: { application/json: { schema: { $ref: "#/components/schemas/Outcome" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: The module reported an error (audited) }

  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: The audit log, newest first (the timeline)
      parameters:
        - { name: module, in: query, schema: { type: string } }
        - { name: instance, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string }, description: 'Actor subject, e.g. "agent:key_5kq2m8x4c1v7"' }
        - { name: q, in: query, schema: { type: string }, description: Text search over action, module, input and output }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, schema: { type: integer }, description: Page backwards from this sequence number }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }

  /audit/verify:
    get:
      operationId: verifyAudit
      tags: [audit]
      summary: Verify the hash chain of the whole log
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, entries]
                properties:
                  ok: { type: boolean }
                  entries: { type: integer }
                  brokenAt: { type: integer }
                  problem: { type: string }

  /audit/changes:
    get:
      operationId: whatChanged
      tags: [audit]
      summary: What changed around a moment
      description: Changes, failures and blocked attempts before `at` (successful reads are counted, not listed).
      parameters:
        - { name: at, in: query, schema: { type: string, format: date-time } }
        - { name: minutes, in: query, schema: { type: integer, default: 60 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [from, to, changes, failures, blocked, readsOmitted]
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  changes: { type: array, items: { $ref: "#/components/schemas/ChangeEntry" } }
                  failures: { type: array, items: { $ref: "#/components/schemas/ChangeEntry" } }
                  blocked: { type: array, items: { $ref: "#/components/schemas/ChangeEntry" } }
                  readsOmitted: { type: integer }

  /audit/{seq}:
    get:
      operationId: getAudit
      tags: [audit]
      summary: One audit entry
      parameters: [{ $ref: "#/components/parameters/Seq" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditEntry" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit/{seq}/undo:
    post:
      operationId: undoAudit
      tags: [audit]
      summary: Undo a reversible action (scope audit:*:undo)
      description: The reversal is a normal call; it passes the policy and is audited.
      parameters: [{ $ref: "#/components/parameters/Seq" }]
      responses:
        "200": { description: Undone, content: { application/json: { schema: { $ref: "#/components/schemas/Outcome" } } } }
        "202": { description: Waiting for approval, content: { application/json: { schema: { $ref: "#/components/schemas/Outcome" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: Approvals, newest first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, denied, expired] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Approval" } } } } }

  /approvals/{id}:
    get:
      operationId: getApproval
      tags: [approvals]
      summary: One approval
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /approvals/{id}/approve:
    post:
      operationId: approve
      tags: [approvals]
      summary: Approve (people only; never API keys)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Not pending }

  /approvals/{id}/deny:
    post:
      operationId: deny
      tags: [approvals]
      summary: Deny (people only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Denied, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Not pending }

  /policy:
    get:
      operationId: getPolicy
      tags: [policy]
      summary: Active preset, panic state and rules
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Policy" } } } }

  /policy/preset:
    put:
      operationId: setPreset
      tags: [policy]
      summary: Change the baseline autonomy preset (people only)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [preset], properties: { preset: { $ref: "#/components/schemas/Preset" } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Policy" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /policy/rules:
    post:
      operationId: putRule
      tags: [policy]
      summary: Create or replace a rule (people only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Rule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /policy/rules/{id}:
    delete:
      operationId: deleteRule
      tags: [policy]
      summary: Delete a rule (people only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }

  /panic:
    get:
      operationId: getPanic
      tags: [panic]
      summary: Whether panic mode is on
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [frozen], properties: { frozen: { type: boolean } } } } } }
    post:
      operationId: panic
      tags: [panic]
      summary: Emergency stop
      description: |
        Freezes every agent, API key and automation; denies all pending
        approvals; revokes every agent key; signs out every other session.
        Anyone authenticated can pull it.
      responses:
        "200":
          description: Panic mode on
          content:
            application/json:
              schema:
                type: object
                required: [frozen, deniedApprovals, revokedAgentKeys, endedSessions]
                properties:
                  frozen: { type: boolean }
                  deniedApprovals: { type: integer }
                  revokedAgentKeys: { type: integer }
                  endedSessions: { type: integer }
    delete:
      operationId: unpanic
      tags: [panic]
      summary: Lift panic mode (owner or admin, signed in)
      responses:
        "200": { description: Panic mode off }
        "403": { $ref: "#/components/responses/Forbidden" }

  /vault:
    get:
      operationId: getVault
      tags: [vault]
      summary: Whether the vault is set up and unlocked
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/VaultStatus" } } } }

  /vault/setup:
    post:
      operationId: setupVault
      tags: [vault]
      summary: Create the vault with a passphrase (owner or admin, signed in)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [passphrase], properties: { passphrase: { type: string, minLength: 12 } } } } }
      responses:
        "200": { description: Set up and unlocked, content: { application/json: { schema: { $ref: "#/components/schemas/VaultStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /vault/unlock:
    post:
      operationId: unlockVault
      tags: [vault]
      summary: Unlock with the passphrase (owner or admin, signed in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: { type: string }
                remember: { type: boolean, description: Keep the key in this computer's keychain so the vault unlocks on start }
      responses:
        "200": { description: Unlocked, content: { application/json: { schema: { $ref: "#/components/schemas/VaultStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /vault/lock:
    post:
      operationId: lockVault
      tags: [vault]
      summary: Lock the vault (anyone authenticated)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { forget: { type: boolean, description: Also remove the key from the keychain } } } } }
      responses:
        "200": { description: Locked, content: { application/json: { schema: { $ref: "#/components/schemas/VaultStatus" } } } }

  /automations:
    get:
      operationId: listAutomations
      tags: [automations]
      summary: All automations
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Automation" } } } } }
    post:
      operationId: createAutomation
      tags: [automations]
      summary: Create an automation
      description: |
        Saved by a signed-in person, its steps may run without asking (scoped
        policy rules are added for exactly those actions). Saved by an API key
        or agent, it is stored disabled and untrusted until a person enables it.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutomationInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Automation" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /automations/{id}:
    get:
      operationId: getAutomation
      tags: [automations]
      summary: One automation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Automation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateAutomation
      tags: [automations]
      summary: Change an automation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutomationInput" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Automation" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAutomation
      tags: [automations]
      summary: Delete an automation and its rules
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }

  /automations/{id}/run:
    post:
      operationId: runAutomation
      tags: [automations]
      summary: Run now and wait for the result
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Finished, content: { application/json: { schema: { $ref: "#/components/schemas/AutomationRun" } } } }
        "409": { description: Turned off, or ran less than 5 seconds ago }

  /automations/{id}/runs:
    get:
      operationId: listAutomationRuns
      tags: [automations]
      summary: Recent runs
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AutomationRun" } } } } }

  /ai/providers:
    get:
      operationId: listProviders
      tags: [assistant]
      summary: Configured AI model providers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Provider" } } } } }
    post:
      operationId: createProvider
      tags: [assistant]
      summary: Add a provider (owner or admin, signed in)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /ai/providers/{id}:
    put:
      operationId: updateProvider
      tags: [assistant]
      summary: Change a provider
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } } }
    delete:
      operationId: deleteProvider
      tags: [assistant]
      summary: Remove a provider
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed }

  /ai/presets:
    get:
      operationId: listProviderPresets
      tags: [assistant]
      summary: Known providers with their endpoints and a suggested model
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Provider" } } } } }

  /ai/detect:
    get:
      operationId: detectProviders
      tags: [assistant]
      summary: Model servers running on this computer (Ollama, LM Studio)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Provider" } } } } }

  /assistant/conversations:
    get:
      operationId: listConversations
      tags: [assistant]
      summary: Your conversations with the assistant
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Conversation" } } } } }

  /assistant/conversations/{id}:
    get:
      operationId: getConversation
      tags: [assistant]
      summary: One conversation with its messages
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteConversation
      tags: [assistant]
      summary: Delete a conversation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }

  /assistant/chat:
    post:
      operationId: chat
      tags: [assistant]
      summary: Send a message to the assistant (people only)
      description: |
        Streams newline-delimited JSON `AssistantStep` objects as the assistant
        works: its text, each tool it calls, each result (including approval
        requests), and finally `done` with the conversation id. The assistant
        acts as an agent, so agent rules and approvals apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [message], properties: { conversation: { type: string }, message: { type: string } } }
      responses:
        "200": { description: Stream of steps, content: { application/x-ndjson: { schema: { $ref: "#/components/schemas/AssistantStep" } } } }

  /mcp-servers:
    get:
      operationId: listMCPServers
      tags: [assistant]
      summary: Outside MCP servers mounted as modules
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MCPServer" } } } } }
    post:
      operationId: addMCPServer
      tags: [assistant]
      summary: Mount an MCP server (people only; stdio servers run a command on this machine)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MCPServer" } } }
      responses:
        "200": { description: Mounted, content: { application/json: { schema: { $ref: "#/components/schemas/MCPServer" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /mcp-servers/{id}:
    put:
      operationId: updateMCPServer
      tags: [assistant]
      summary: Change and remount an MCP server
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MCPServer" } } }
      responses:
        "200": { description: Mounted, content: { application/json: { schema: { $ref: "#/components/schemas/MCPServer" } } } }
    delete:
      operationId: removeMCPServer
      tags: [assistant]
      summary: Unmount and remove an MCP server
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed }

  /ambient:
    get:
      operationId: ambientStatus
      tags: [system]
      summary: The boiled-down state for lights, Stream Deck keys and status bars
      description: ok, attention (approvals waiting or a connection degraded), down (a connection down) or stopped (emergency stop), with a colour and a summary. Any key with modules:*:read can poll it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Ambient" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /system/update:
    get:
      operationId: updateStatus
      tags: [system]
      summary: Self-update state of this daemon
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } } }
  /system/update/check:
    post:
      operationId: checkUpdate
      tags: [system]
      summary: Ask the release feed for a newer signed release
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } } }
        "502": { description: The feed couldn't be read or the release didn't verify, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /system/update/apply:
    post:
      operationId: applyUpdate
      tags: [system]
      summary: Install the available release and restart (people only)
      description: |
        Downloads the release, checks its signature and checksum, swaps the
        binary (keeping the old one), answers 202 and restarts. A new version
        that fails to start three times is rolled back automatically. Refused
        when the desktop app manages this daemon.
      responses:
        "202": { description: Installed; restarting, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } } }
        "409": { description: Nothing to install, or not allowed here, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /remote:
    get:
      operationId: remoteStatus
      tags: [remote]
      summary: Hub link, relay connection and paired remote devices
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RemoteStatus" } } } }
  /remote/link:
    post:
      operationId: linkHub
      tags: [remote]
      summary: Link this daemon to a hub account with a pairing code from that account
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [hub, code], properties: { hub: { type: string }, code: { type: string } } }
      responses:
        "200": { description: Linked, content: { application/json: { schema: { $ref: "#/components/schemas/RemoteStatus" } } } }
        "502": { description: The hub refused or couldn't be reached, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: unlinkHub
      tags: [remote]
      summary: Unpair from the hub and stop the relay
      responses:
        "204": { description: Unlinked }
  /remote/pairings:
    post:
      operationId: createRemotePairing
      tags: [remote]
      summary: A one-time QR payload (valid 10 minutes) for a phone or browser to pair
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RemotePairing" } } } }
        "409": { description: Not linked to a hub, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /remote/clients/{id}:
    delete:
      operationId: removeRemoteClient
      tags: [remote]
      summary: Stop a paired device from connecting
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: The caller's API keys (all=1 for every key, admin)
      parameters:
        - { name: all, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } } } } }
    post:
      operationId: createKey
      tags: [keys]
      summary: Create an API key (people only). The secret is returned once.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewKey" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedKey" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /keys/{id}:
    get:
      operationId: getKey
      tags: [keys]
      summary: One key's metadata
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: revokeKey
      tags: [keys]
      summary: Revoke a key immediately
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /keys/{id}/rotate:
    post:
      operationId: rotateKey
      tags: [keys]
      summary: Issue a replacement; the old key works until the grace period ends
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { graceSeconds: { type: integer, description: Seconds the old key keeps working (default 86400) } } } } }
      responses:
        "201": { description: Rotated, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedKey" } } } }

  /keys/{id}/usage:
    get:
      operationId: getKeyUsage
      tags: [keys]
      summary: Recent requests made with a key (30 days)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [at, method, path, status, ip]
                  properties:
                    at: { type: string, format: date-time }
                    method: { type: string }
                    path: { type: string }
                    status: { type: integer }
                    ip: { type: string }

  /events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Live event stream (server-sent events)
      description: |
        Each message's `event` field is the event type (e.g. `action.ok`,
        `approval.requested`, `panic.on`); `data` is an EventEnvelope.
      parameters:
        - { name: prefix, in: query, schema: { type: string }, description: Only events whose type starts with this }
      responses:
        "200": { description: Stream, content: { text/event-stream: { schema: { type: string } } } }

  /webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: Outbound webhooks (secrets are never listed)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } } } } }
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Send matching events to a URL, signed with HMAC-SHA256 (signed-in people only)
      description: The answer includes the signing secret, shown only this once. See docs/api/webhooks.md for the signature format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                name: { type: string }
                url: { type: string, description: "https:// (or http:// on your own network)" }
                events: { type: array, items: { type: string }, description: "Event type prefixes such as action. or approval.requested; empty for every event" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /webhooks/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: One webhook
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Switch a webhook on or off (on resets its failure count)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Remove a webhook and its delivery log
      responses:
        "204": { description: Removed }
  /webhooks/{id}/rotate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Replace the signing secret; the old one stops working at once
      responses:
        "200": { description: The new secret, content: { application/json: { schema: { type: object, required: [secret], properties: { secret: { type: string } } } } } }
  /webhooks/{id}/test:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: testWebhook
      tags: [webhooks]
      summary: Send a webhook.test event now and report how the receiver answered
      responses:
        "200": { description: The delivery, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
  /webhooks/{id}/deliveries:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Recent deliveries, newest first (the last 500 are kept)
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } } } } }
  /sync:
    get:
      operationId: syncStatus
      tags: [sync]
      summary: Whether this daemon syncs, what, with whom, and how the last round went
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SyncStatus" } } } }
  /sync/group:
    post:
      operationId: createSyncGroup
      tags: [sync]
      summary: Start a sync group and get its join code (signed-in people only)
      description: The join code is the group key. Anyone with it can read and change what the group syncs, so treat it like a password.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncSetup" } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, required: [code, status], properties: { code: { type: string }, status: { $ref: "#/components/schemas/SyncStatus" } } }
    delete:
      operationId: leaveSyncGroup
      tags: [sync]
      summary: Stop syncing and forget the group key; local data stays
      responses:
        "204": { description: Left }
  /sync/join:
    post:
      operationId: joinSyncGroup
      tags: [sync]
      summary: Join a group with a code from another daemon (signed-in people only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncSetup" } } }
      responses:
        "200": { description: Joined, content: { application/json: { schema: { $ref: "#/components/schemas/SyncStatus" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /sync/code:
    get:
      operationId: syncJoinCode
      tags: [sync]
      summary: Show the join code again, to add another daemon (signed-in people only; audited)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
  /sync/settings:
    put:
      operationId: updateSyncSettings
      tags: [sync]
      summary: Change what syncs and the peers on the local network
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncSetup" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SyncStatus" } } } }
  /sync/run:
    post:
      operationId: runSync
      tags: [sync]
      summary: Sync now
      responses:
        "200": { description: One result per collection and transport, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SyncRun" } } } } }
  /notify/phone:
    post:
      operationId: setupPhonePush
      tags: [system]
      summary: Send approvals and alerts to a phone through ntfy, without Google services (signed-in people only)
      description: Creates a Notifications channel with a random ntfy topic that forwards approval requests, sends a first test message, and answers the ntfy:// link that subscribes the phone's ntfy app. With private (the default) only "something needs your attention" and a link are sent, so a public ntfy server never sees details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server: { type: string, description: "ntfy server, default https://ntfy.sh" }
                private: { type: boolean, default: true }
                appUrl: { type: string, description: "Link the notification opens, default conduit://open" }
      responses:
        "201":
          description: Set up
          content:
            application/json:
              schema:
                type: object
                required: [instance, topic, subscribe, web]
                properties:
                  instance: { $ref: "#/components/schemas/Instance" }
                  topic: { type: string }
                  subscribe: { type: string, description: "ntfy://host/topic" }
                  web: { type: string }
  /auth/oidc:
    get:
      operationId: ssoStatus
      tags: [auth]
      summary: Whether single sign-on is on, and the label for its button (public)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [enabled, label], properties: { enabled: { type: boolean }, label: { type: string } } }
    put:
      operationId: updateSsoSettings
      tags: [auth]
      summary: Configure single sign-on with an OpenID Connect provider (signed-in people only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OIDCSettings" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/OIDCSettings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/oidc/settings:
    get:
      operationId: getSsoSettings
      tags: [auth]
      summary: Single sign-on settings and the redirect URI to register with the provider (signed-in people only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OIDCSettings" } } } }
  /auth/oidc/link:
    get:
      operationId: linkOIDC
      tags: [auth]
      summary: Link your account to your identity at the provider (a browser navigation; signed-in people only)
      description: Starts the provider's sign-in and, on return, links the provider's stable subject to your account, then redirects to /settings?sso=linked. Owners and admins must link before single sign-on works for them; members and viewers are linked on their first sign-in from an allowed domain.
      responses:
        "302": { description: To the provider }
    delete:
      operationId: unlinkOIDC
      tags: [auth]
      summary: Remove your linked identities
      responses:
        "204": { description: Removed }
  /auth/oidc/me:
    get:
      operationId: myOIDCLink
      tags: [auth]
      summary: Whether your account has a linked identity
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [linked], properties: { linked: { type: boolean } } } } } }
  /auth/oidc/start:
    get:
      operationId: ssoStart
      tags: [auth]
      summary: Start signing in with the provider (a browser navigation; redirects to the provider)
      security: []
      responses:
        "302": { description: To the provider's sign-in page, or to /?signin_error=<code> }
  /auth/oidc/callback:
    get:
      operationId: ssoCallback
      tags: [auth]
      summary: Where the provider sends the browser back; starts a session and redirects to /
      description: "Failures redirect to /?signin_error=<code>: state, expired, provider, provider_refused, config, exchange, token, no_id_token, unverified, domain, no_account, disabled, account, session, sso_off or busy."
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: To / with a session cookie, or to /?signin_error=<code> }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Seq: { name: seq, in: path, required: true, schema: { type: integer } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Not signed in or key rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Missing scope or forbidden by policy, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    OIDCSettings:
      type: object
      properties:
        enabled: { type: boolean }
        issuer: { type: string, description: "The provider's issuer URL, e.g. https://accounts.google.com" }
        clientId: { type: string }
        clientSecret: { type: string, description: "A secret:// vault reference; a plain secret is refused" }
        label: { type: string, description: "Shown on the button: Sign in with <label>" }
        allowedDomains: { type: array, items: { type: string }, description: Email domains that may sign in; empty allows any verified address that already has an account }
        autoCreate: { type: boolean, description: Make an account on first sign-in for addresses in an allowed domain }
        newUserRole: { type: string, enum: [member, viewer] }
        redirectBase: { type: string, description: "This daemon's address as the provider knows it; empty uses the request's origin" }
        redirectUri: { type: string, readOnly: true, description: Register this with the provider }
    SyncSetup:
      type: object
      properties:
        code: { type: string, description: The join code (joinSyncGroup only) }
        collections: { type: array, items: { type: string, enum: [vault, policy, automations] } }
        peers: { type: array, items: { type: string }, description: "Other daemons to sync with directly, like http://192.168.1.20:7600" }
    SyncRun:
      type: object
      required: [collection, transport, ok, sent, received]
      properties:
        collection: { type: string }
        transport: { type: string, description: "hub, or peer <address>" }
        ok: { type: boolean }
        skipped: { type: string }
        error: { type: string }
        sent: { type: integer, description: Local changes sent }
        received: { type: integer, description: Changes applied here }
    SyncStatus:
      type: object
      required: [enabled, collections, peers, viaHub, results, available]
      properties:
        enabled: { type: boolean }
        groupId: { type: string, description: A short public name for the group; not secret }
        collections: { type: array, items: { type: string } }
        peers: { type: array, items: { type: string } }
        viaHub: { type: boolean, description: True when this daemon is linked to a hub and syncs through it }
        lastRun: { type: string, format: date-time }
        results: { type: array, items: { $ref: "#/components/schemas/SyncRun" } }
        available:
          type: array
          items: { type: object, required: [name, description], properties: { name: { type: string }, description: { type: string } } }
    Webhook:
      type: object
      required: [id, name, url, events, enabled, failures, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        events: { type: array, items: { type: string } }
        enabled: { type: boolean }
        failures: { type: integer, description: Consecutive failed deliveries; 25 switch the webhook off }
        createdAt: { type: string, format: date-time }
        secret: { type: string, description: Only in the answer to createWebhook }
    WebhookDelivery:
      type: object
      required: [id, event, at, status, attempts, ok, durationMs]
      properties:
        id: { type: string, description: Also sent as X-Conduit-Delivery }
        event: { type: string }
        at: { type: string, format: date-time }
        status: { type: integer, description: Last HTTP status; 0 when the receiver didn't answer }
        attempts: { type: integer }
        ok: { type: boolean }
        error: { type: string }
        durationMs: { type: integer }
    Ambient:
      type: object
      required: [state, color, summary, approvalsWaiting, down, since]
      properties:
        state: { type: string, enum: [ok, attention, down, stopped] }
        color: { type: string, enum: [green, amber, red, purple] }
        summary: { type: string }
        approvalsWaiting: { type: integer }
        down: { type: array, items: { type: string } }
        since: { type: string, format: date-time }
    UpdateRelease:
      type: object
      required: [component, channel, platform, version, url, sha256]
      properties:
        component: { type: string }
        channel: { type: string }
        platform: { type: string }
        version: { type: string }
        url: { type: string }
        sha256: { type: string }
        notes: { type: string }
    UpdateStatus:
      type: object
      required: [current, platform, managed, feed]
      properties:
        current: { type: string }
        platform: { type: string }
        managed: { type: boolean, description: The desktop app updates this daemon }
        feed: { type: string }
        available: { $ref: "#/components/schemas/UpdateRelease" }
        checkedAt: { type: string, format: date-time }
        lastError: { type: string }
        last:
          type: object
          required: [from, to, result, at]
          properties:
            from: { type: string }
            to: { type: string }
            result: { type: string, enum: [applied, confirmed, rolled_back] }
            at: { type: string, format: date-time }
            detail: { type: string }
    RemoteStatus:
      type: object
      required: [linked, connected, publicKey, fingerprint, clients, streams, lan]
      properties:
        linked: { type: boolean }
        link:
          type: object
          properties:
            hub: { type: string }
            deviceId: { type: string }
            account: { type: string }
            linkedAt: { type: string, format: date-time }
        connected: { type: boolean }
        lastError: { type: string }
        publicKey: { type: string }
        fingerprint: { type: string }
        streams: { type: integer }
        lan: { type: array, items: { type: string }, description: Direct ws:// addresses on the local network }
        clients:
          type: array
          items:
            type: object
            required: [id, name, fingerprint, createdAt, lastSeenAt]
            properties:
              id: { type: string }
              name: { type: string }
              fingerprint: { type: string }
              createdAt: { type: string, format: date-time }
              lastSeenAt: { type: string, format: date-time }
    RemotePairing:
      type: object
      required: [v, hub, daemon, key, secret, name, expiresAt, uri]
      properties:
        v: { type: integer }
        hub: { type: string }
        daemon: { type: string }
        key: { type: string }
        secret: { type: string }
        name: { type: string }
        lan: { type: string, description: Direct address on the local network, tried before the hub }
        expiresAt: { type: string, format: date-time }
        uri: { type: string, description: "conduit://pair?d=<base64url JSON>, for the QR code" }
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    Version:
      type: object
      required: [version, commit, date, go, os, arch]
      properties:
        version: { type: string }
        commit: { type: string }
        date: { type: string }
        go: { type: string }
        os: { type: string }
        arch: { type: string }
    Role: { type: string, enum: [owner, admin, member, viewer] }
    User:
      type: object
      required: [id, name, email, role, createdAt, disabled]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        disabled: { type: boolean }
    Session:
      type: object
      required: [id, userId, device, createdAt, lastSeenAt, expiresAt]
      properties:
        id: { type: string }
        userId: { type: string }
        device: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    SessionResponse:
      type: object
      required: [user, session, token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        session: { $ref: "#/components/schemas/Session" }
        token: { type: string, description: For native clients; browsers use the cookie }
    ActorKind: { type: string, enum: [user, agent, key, automation, system] }
    Actor:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ActorKind" }
        name: { type: string }
    Risk: { type: string, enum: [read, write, destructive] }
    ActionSpec:
      type: object
      required: [name, title, description, risk]
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        risk: { $ref: "#/components/schemas/Risk" }
        input: { type: object, additionalProperties: true, description: JSON Schema }
        output: { type: object, additionalProperties: true, description: JSON Schema }
        reversible: { type: boolean }
        dryRun: { type: boolean }
        sensitive: { type: boolean, description: Input and output hold secret material and are never logged }
    ResourceSpec:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string }
        title: { type: string }
        schema: { type: object, additionalProperties: true }
        listAction: { type: string }
        getAction: { type: string }
        viewHint: { type: string, enum: [table, log, chart, detail] }
    EventSpec:
      type: object
      required: [type, description]
      properties:
        type: { type: string }
        description: { type: string }
        schema: { type: object, additionalProperties: true }
    Manifest:
      type: object
      required: [id, name, version, description, actions]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        icon: { type: string }
        category: { type: string }
        configSchema: { type: object, additionalProperties: true, description: JSON Schema for an instance's settings }
        actions: { type: array, items: { $ref: "#/components/schemas/ActionSpec" } }
        resources: { type: array, items: { $ref: "#/components/schemas/ResourceSpec" } }
        events: { type: array, items: { $ref: "#/components/schemas/EventSpec" } }
        presets: { type: array, items: { type: string } }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down, unconfigured] }
        message: { type: string }
    Instance:
      type: object
      required: [id, module, name, config, enabled, createdAt, updatedAt]
      properties:
        id: { type: string }
        module: { type: string }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        health: { $ref: "#/components/schemas/Health" }
    InstanceInput:
      type: object
      properties:
        module: { type: string, description: Required on create }
        name: { type: string }
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }
    Change:
      type: object
      required: [target, op]
      properties:
        target: { type: string }
        op: { type: string }
        before: {}
        after: {}
    Plan:
      type: object
      required: [summary, changes]
      properties:
        summary: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
    Undo:
      type: object
      required: [action, input, description]
      properties:
        action: { type: string }
        input: {}
        description: { type: string }
    Result:
      type: object
      properties:
        output: {}
        plan: { $ref: "#/components/schemas/Plan" }
        undo: { $ref: "#/components/schemas/Undo" }
    Decision:
      type: object
      required: [effect, reason]
      properties:
        effect: { $ref: "#/components/schemas/Effect" }
        reason: { type: string }
        ruleId: { type: string }
    Effect: { type: string, enum: [allow, ask, deny] }
    AuditEntry:
      type: object
      required: [seq, at, actor, module, instance, action, risk, decision, status, dryRun, input, output, prevHash, hash]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        module: { type: string }
        instance: { type: string }
        action: { type: string }
        risk: { $ref: "#/components/schemas/Risk" }
        decision: { $ref: "#/components/schemas/Effect" }
        status: { type: string, enum: [ok, error, denied, planned] }
        dryRun: { type: boolean }
        input: {}
        output: {}
        error: { type: string }
        undo: { $ref: "#/components/schemas/Undo" }
        undoneBy: { type: integer }
        undoes: { type: integer }
        prevHash: { type: string }
        hash: { type: string }
    Approval:
      type: object
      required: [id, createdAt, actor, module, instance, action, risk, input, status, expiresAt]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        module: { type: string }
        instance: { type: string }
        action: { type: string }
        risk: { $ref: "#/components/schemas/Risk" }
        input: {}
        plan: { $ref: "#/components/schemas/Plan" }
        status: { type: string, enum: [pending, approved, denied, expired] }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        resultSeq: { type: integer, format: int64, description: "Audit entry of the call once it ran after approval (callers that did not wait get it run in the background)" }
    Outcome:
      type: object
      required: [result, decision, audit]
      properties:
        result: { $ref: "#/components/schemas/Result" }
        decision: { $ref: "#/components/schemas/Decision" }
        audit: { $ref: "#/components/schemas/AuditEntry" }
        approval: { $ref: "#/components/schemas/Approval" }
    Preset: { type: string, enum: [read-only, ask-writes, ask-destructive, full-autonomy] }
    Rule:
      type: object
      required: [effect]
      properties:
        id: { type: string }
        position: { type: integer }
        subject: { type: string, description: '"*", "kind:agent" or "<kind>:<id>"' }
        module: { type: string }
        instance: { type: string }
        action: { type: string }
        risk: { type: string }
        effect: { $ref: "#/components/schemas/Effect" }
        expiresAt: { type: string, format: date-time }
        note: { type: string }
    Policy:
      type: object
      required: [preset, presets, frozen, rules]
      properties:
        preset: { $ref: "#/components/schemas/Preset" }
        presets: { type: array, items: { $ref: "#/components/schemas/Preset" } }
        frozen: { type: boolean }
        rules: { type: array, items: { $ref: "#/components/schemas/Rule" } }
    ChangeEntry:
      type: object
      required: [entry, at, who, what, status]
      properties:
        entry: { type: integer }
        at: { type: string, format: date-time }
        who: { type: string }
        what: { type: string }
        status: { type: string }
        error: { type: string }
        undo: { type: string }
    MCPServer:
      type: object
      required: [name, transport]
      properties:
        id: { type: string }
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string }, description: Values may be secret:// references }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string }, description: Values may be secret:// references }
        trustReadOnly: { type: boolean, description: "Treat tools the server marks readOnlyHint as reads. Off: every tool is at least a write unless riskOverrides says otherwise." }
        riskOverrides: { type: object, additionalProperties: { type: string, enum: [read, write, destructive] } }
    VaultStatus:
      type: object
      required: [setUp, unlocked, secrets, remembered]
      properties:
        setUp: { type: boolean }
        unlocked: { type: boolean }
        secrets: { type: integer }
        remembered: { type: boolean }
    Trigger:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [schedule, event, webhook, manual] }
        cron: { type: string, description: 'Five fields, e.g. "30 7 * * 1-5"' }
        timezone: { type: string }
        event: { type: string, description: Event type or prefix }
        match: { type: object, additionalProperties: { type: string }, description: 'Dotted path in the event → required value, e.g. {"data.name": "Shop"}' }
    Step:
      type: object
      required: [instance, action]
      properties:
        instance: { type: string }
        action: { type: string }
        input: { description: 'Strings may use {{trigger.<path>}} and {{steps.<n>.output.<path>}}' }
        continueOnError: { type: boolean }
    AutomationInput:
      type: object
      required: [name, trigger, steps]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        trigger: { $ref: "#/components/schemas/Trigger" }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
    Automation:
      type: object
      required: [id, name, enabled, trigger, steps, createdBy, createdAt, updatedAt, trusted]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        trigger: { $ref: "#/components/schemas/Trigger" }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        hookPath: { type: string, description: 'For webhook triggers: POST to <daemon>/hooks/<token>. Shown to people only.' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        trusted: { type: boolean, description: A person saved or enabled it, so its steps run without asking }
    AutomationRun:
      type: object
      required: [id, automation, startedAt, trigger, status, steps]
      properties:
        id: { type: string }
        automation: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        trigger: {}
        status: { type: string, enum: [running, ok, error, denied] }
        error: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [action, status]
            properties:
              action: { type: string }
              status: { type: string }
              output: {}
              error: { type: string }
              audit: { type: integer }
    Provider:
      type: object
      required: [kind, baseUrl, model]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [anthropic, openai], description: '"openai" means any OpenAI-compatible API (OpenAI, Gemini, Mistral, OpenRouter, Ollama, LM Studio, vLLM, gateways)' }
        baseUrl: { type: string }
        model: { type: string }
        apiKey: { type: string, description: Vault reference; empty for local servers }
        headers: { type: object, additionalProperties: { type: string } }
        default: { type: boolean }
    AssistantMessage:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [user, assistant, tool] }
        text: { type: string }
        toolCalls: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string }, args: {} } } }
        toolCallId: { type: string }
        isError: { type: boolean }
    Conversation:
      type: object
      required: [id, title, provider, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        provider: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages: { type: array, items: { $ref: "#/components/schemas/AssistantMessage" } }
    AssistantStep:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [text, tool, result, done, error] }
        text: { type: string }
        tool: { type: string }
        title: { type: string }
        args: {}
        isError: { type: boolean }
        approval: { $ref: "#/components/schemas/Approval" }
        audit: { type: integer }
        conversation: { type: string }
    KeyKind: { type: string, enum: [live, test, agent] }
    ApiKey:
      type: object
      required: [id, name, kind, prefix, ownerId, scopes, ipAllow, ratePerMin, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/KeyKind" }
        prefix: { type: string, description: Safe to display, e.g. cdt_live_5kq2m8x4c1v7 }
        ownerId: { type: string }
        scopes: { type: array, items: { type: string } }
        ipAllow: { type: array, items: { type: string } }
        ratePerMin: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        revokeReason: { type: string }
        rotatedTo: { type: string }
        graceUntil: { type: string, format: date-time }
    NewKey:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/KeyKind" }
        scopes: { type: array, items: { type: string }, description: 'See docs/api/keys.md, e.g. "actions:*:invoke"' }
        ipAllow: { type: array, items: { type: string }, description: IPs or CIDR ranges }
        ratePerMin: { type: integer, description: Requests per minute (default 120) }
        expiresAt: { type: string, format: date-time }
    CreatedKey:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        secret: { type: string, description: The full key. Shown exactly once. }
    EventEnvelope:
      type: object
      required: [type, module, at]
      properties:
        type: { type: string }
        module: { type: string }
        instance: { type: string }
        data: {}
        at: { type: string, format: date-time }
