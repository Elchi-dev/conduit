openapi: 3.1.0
info:
  title: Conduit Hub API
  version: 0.1.0
  description: |
    The hub is the optional meeting point for Conduit daemons and clients:
    accounts, organisations, device pairing, the end-to-end encrypted relay,
    encrypted sync, the module registry and the signed update feed.

    Anyone can run a hub (see docs/self-hosting). Accounts belong to one hub
    and are never shared between hubs. The protocol is described in
    docs/protocol/hub.md; this file is the source of truth for the HTTP
    surface, and a test in internal/hub fails if it drifts from the code.

    Authenticate with `Authorization: Bearer <token>`:
    - `chs_…` session token from `POST /sessions` (a person; full access),
    - `chd_…` device token from `POST /devices/pair` (relay, sync, registry reads, and rating, reviewing and reporting modules for its account),
    - `chk_…` hub API key from `POST /keys` (only its scopes).
servers:
  - url: http://localhost:7700/v1
security:
  - bearer: []
tags:
  - name: hub
  - name: accounts
  - name: orgs
  - name: devices
  - name: relay
  - name: sync
  - name: keys
  - name: registry
  - name: updates
  - name: admin
paths:
  /version:
    get:
      tags: [hub]
      security: []
      summary: Build information
      responses:
        "200": { description: Version, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /info:
    get:
      tags: [hub]
      security: []
      summary: What this hub offers
      responses:
        "200":
          description: Hub info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  url: { type: string }
                  openRegistration: { type: boolean }
                  mail: { type: boolean, description: Whether the operator configured real email delivery }
                  version: { type: string }
                  relayVersion: { type: integer }
                  releaseKey: { type: string, description: Base64 ed25519 key release manifests are signed with }

  /accounts:
    post:
      tags: [accounts]
      security: []
      summary: Create an account
      description: |
        Sends a verification email. Answers 202 whether or not the address
        already has an account, so addresses can't be probed. Limited to 10
        attempts per address per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                name: { type: string }
                password: { type: string, minLength: 10 }
                inviteToken: { type: string, description: "An unused, unexpired invitation sent to this email address; lets invited people register on hubs with closed registration. Accepting it (POST /v1/invites/accept) adds the membership." }
      responses:
        "202": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /accounts/verify:
    post:
      tags: [accounts]
      security: []
      summary: Confirm an email address with the emailed token
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { type: object, properties: { verified: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /accounts/password-reset:
    post:
      tags: [accounts]
      security: []
      summary: Email a password reset link
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "202": { $ref: "#/components/responses/Status" }
  /accounts/password-reset/confirm:
    post:
      tags: [accounts]
      security: []
      summary: Set a new password; ends every session
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 10 } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
  /sessions:
    post:
      tags: [accounts]
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                device: { type: string, description: A label for this sign-in }
      responses:
        "200":
          description: Signed in (sessions last 30 days), or, for accounts with two-factor sign-in, `{twoFactor:true, challenge}` for POST /sessions/2fa
          content:
            application/json:
              schema:
                oneOf:
                  - { type: object, required: [token, account], properties: { token: { type: string }, account: { $ref: "#/components/schemas/Account" } } }
                  - { $ref: "#/components/schemas/TwoFactorChallenge" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [accounts]
      summary: Sign out this session
      responses:
        "204": { description: Signed out }
  /sessions/passkey/begin:
    post:
      tags: [accounts]
      security: []
      summary: Start signing in with a passkey (no email address needed)
      description: Answers the WebAuthn request options for a discoverable credential and a ceremony id, valid once for five minutes. Pass `options.publicKey` to navigator.credentials.get().
      responses:
        "200": { description: Request options, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyCeremony" } } } }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sessions/passkey/finish:
    post:
      tags: [accounts]
      security: []
      summary: Finish signing in with a passkey
      description: Same answer as a password sign-in, and the same new-sign-in email. A signature counter that went backwards (a possibly copied passkey) is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, response]
              properties:
                ceremony: { type: string }
                device: { type: string, description: A label for this sign-in }
                response: { type: object, description: The PublicKeyCredential from navigator.credentials.get(), as JSON with base64url fields }
      responses:
        "200":
          description: Signed in; sessions last 30 days
          content:
            application/json:
              schema: { type: object, required: [token, account], properties: { token: { type: string }, account: { $ref: "#/components/schemas/Account" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /passkeys:
    get:
      tags: [accounts]
      summary: Your passkeys (signed-in person only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Passkey" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /passkeys/register/begin:
    post:
      tags: [accounts]
      summary: Start adding a passkey (signed-in person with a confirmed email, and the account password)
      description: Answers WebAuthn creation options (resident key required) and a ceremony id. Pass `options.publicKey` to navigator.credentials.create(). At most 20 passkeys per account. A password reset removes every passkey.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        "200": { description: Creation options, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyCeremony" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /passkeys/register/finish:
    post:
      tags: [accounts]
      summary: Finish adding a passkey; the account's address gets an email about it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony, response]
              properties:
                ceremony: { type: string }
                name: { type: string, maxLength: 60, description: e.g. "Work laptop" }
                response: { type: object, description: The PublicKeyCredential from navigator.credentials.create(), as JSON with base64url fields }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /passkeys/{id}:
    delete:
      tags: [accounts]
      summary: Remove a passkey; the account's address gets an email about it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /me:
    get:
      tags: [accounts]
      summary: Who is calling
      responses:
        "200":
          description: Caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  device: { type: string, description: Set for device tokens }
                  scopes: { type: [array, "null"], items: { type: string }, description: Null for a full session }
        "401": { $ref: "#/components/responses/Error" }
  /me/resend-verification:
    post:
      tags: [accounts]
      summary: Send the verification email again
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "202": { $ref: "#/components/responses/Status" }

  /orgs:
    get:
      tags: [orgs]
      summary: Organisations you belong to (scope orgs:read)
      responses:
        "200": { description: Orgs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Org" } } } } }
    post:
      tags: [orgs]
      summary: Create an organisation; you become its owner
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 80 } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
  /orgs/{id}/members:
    get:
      tags: [orgs]
      summary: Members of an organisation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Member" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /orgs/{id}/invites:
    post:
      tags: [orgs]
      summary: Invite someone by email (owners and admins)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string }, role: { type: string, enum: [member, admin, owner] } } }
      responses:
        "202": { $ref: "#/components/responses/Status" }
        "403": { $ref: "#/components/responses/Error" }
  /orgs/{id}/members/{account}:
    delete:
      tags: [orgs]
      summary: Remove a member, or leave
      description: Owners remove anyone, admins remove members, everyone can leave. The last owner can't leave.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: account, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /invites/accept:
    post:
      tags: [orgs]
      summary: Accept an emailed invitation
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { description: Joined, content: { application/json: { schema: { type: object, properties: { org: { type: string }, role: { type: string } } } } } }
        "403": { $ref: "#/components/responses/Error" }

  /pairing-codes:
    post:
      tags: [devices]
      summary: Make a one-time code to pair a device (valid 10 minutes)
      responses:
        "201":
          description: Code
          content:
            application/json:
              schema: { type: object, properties: { code: { type: string }, expiresAt: { type: string, format: date-time } } }
  /devices/pair:
    post:
      tags: [devices]
      security: []
      summary: Pair a daemon or client with a pairing code
      description: Returns a device token, shown once. Daemons must send their X25519 relay public key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, kind]
              properties:
                code: { type: string }
                name: { type: string }
                kind: { type: string, enum: [daemon, client] }
                publicKey: { type: string, description: Base64url X25519 public key }
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: "#/components/schemas/Device" }
                  token: { type: string }
                  account: { type: object, properties: { id: { type: string }, email: { type: string } } }
                  hub: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /devices:
    get:
      tags: [devices]
      summary: Your paired devices, with relay presence
      responses:
        "200": { description: Devices, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } } }
  /devices/{id}:
    delete:
      tags: [devices]
      summary: Unpair a device; drops its relay connection
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }

  /relay/daemon:
    get:
      tags: [relay]
      summary: WebSocket a daemon keeps open to be reachable
      description: |
        Upgrade to WebSocket with a daemon device token (header, or `?token=`
        for clients that can't set headers). Binary messages carry a 4-byte
        big-endian stream id followed by one end-to-end encrypted frame; text
        messages are `{"type":"open"|"close","stream":n}` control events.
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /relay/connect/{daemon}:
    get:
      tags: [relay]
      security: []
      summary: WebSocket a client opens to reach a daemon
      description: |
        Each binary message is one frame. The first is the client's plaintext
        handshake hello; every later frame is encrypted (pkg/relay). The hub
        doesn't authenticate clients; the daemon does, end to end.
      parameters: [{ name: daemon, in: path, required: true, schema: { type: string } }]
      responses:
        "101": { description: Switching protocols }
        "404": { $ref: "#/components/responses/Error" }

  /sync:
    get:
      tags: [sync]
      summary: List your sync blobs (without data)
      responses:
        "200": { description: Blobs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Blob" } } } } }
  /sync/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,99}$" } }]
    get:
      tags: [sync]
      summary: Read a blob
      responses:
        "200": { description: Blob, content: { application/json: { schema: { $ref: "#/components/schemas/Blob" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [sync]
      summary: Write a blob with an optimistic version
      description: Send version 0 to create, or the version you last read. A mismatch answers 409 with the current blob.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [data], properties: { version: { type: integer }, data: { type: string, description: Client-encrypted, at most 1 MiB } } }
      responses:
        "200": { description: Written, content: { application/json: { schema: { $ref: "#/components/schemas/Blob" } } } }
        "409": { description: Version conflict, content: { application/json: { schema: { type: object, properties: { error: { type: string }, current: { $ref: "#/components/schemas/Blob" } } } } } }
        "413": { $ref: "#/components/responses/Error" }
    delete:
      tags: [sync]
      summary: Delete a blob
      responses:
        "204": { description: Deleted }

  /keys:
    get:
      tags: [keys]
      summary: Your hub API keys
      responses:
        "200": { description: Keys, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HubKey" } } } } }
    post:
      tags: [keys]
      summary: Create a hub API key; the secret is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string, enum: [orgs:read, devices:read, sync, registry:read, registry:review, registry:publish, releases:publish] } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { type: object, properties: { key: { $ref: "#/components/schemas/HubKey" }, secret: { type: string } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /keys/{id}:
    delete:
      tags: [keys]
      summary: Revoke a hub API key
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Revoked }

  /registry/packages:
    get:
      tags: [registry]
      security: []
      summary: Search the marketplace
      description: Listed (not delisted) packages. `relevance` ranks name matches over tag matches over description matches. The total number of matches is in the `X-Total-Count` header.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: A category id from GET /registry/categories }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, installs, rating, newest, updated], default: relevance }, description: "rating sorts by a weighted average (two imaginary 3-star ratings added)" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Packages
          headers: { X-Total-Count: { schema: { type: integer } } }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Package" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}:
    get:
      tags: [registry]
      security: []
      summary: A module with its listing, all versions and its author key
      description: Package names contain a slash (`handle/module`); escape it as `%2F`. Delisted packages are still answered (with `delisted` and the reason) so daemons that have them can warn. `download=1` is accepted for older daemons and counts nothing; installs are counted with POST /registry/installs.
      parameters:
        - { $ref: "#/components/parameters/PackageName" }
        - { name: download, in: query, schema: { type: string } }
      responses:
        "200":
          description: Package
          content:
            application/json:
              schema:
                type: object
                properties:
                  package: { $ref: "#/components/schemas/Package" }
                  authorKey: { type: string }
                  versions: { type: array, items: { $ref: "#/components/schemas/PackageVersion" } }
                  readme: { type: string, description: "Markdown. Clients render it without raw HTML: tags show as text" }
                  screenshots: { type: array, items: { $ref: "#/components/schemas/Screenshot" } }
                  author:
                    type: object
                    properties:
                      handle: { type: string }
                      verified: { type: boolean }
                      banned: { type: boolean }
                      banReason: { type: string }
                      createdAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /registry/authors:
    post:
      tags: [registry]
      summary: Register as an author, or rotate your signing key
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [handle, publicKey], properties: { handle: { type: string }, publicKey: { type: string, description: Base64 ed25519 public key } } }
      responses:
        "201": { $ref: "#/components/responses/Status" }
        "200": { $ref: "#/components/responses/Status" }
        "409": { $ref: "#/components/responses/Error" }
  /registry/authors/{handle}:
    get:
      tags: [registry]
      security: []
      summary: An author's public key
      parameters: [{ name: handle, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Author, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}/versions:
    post:
      tags: [registry]
      summary: Publish a signed version (scope registry:publish)
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      requestBody: { $ref: "#/components/requestBodies/Signed" }
      responses:
        "201": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}/versions/{version}/yank:
    post:
      tags: [registry]
      summary: Yank a version so it's no longer offered
      parameters:
        - { $ref: "#/components/parameters/PackageName" }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Yanked }
  /registry/categories:
    get:
      tags: [registry]
      security: []
      summary: The marketplace categories, with how many listed packages each has
      responses:
        "200": { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } } } }
  /registry/packages/{name}/listing:
    put:
      tags: [registry]
      summary: Edit a package's listing (its author, scope registry:publish)
      description: Fields left out stay as they are. The readme is Markdown up to 64 KiB, at most 3 categories and 8 tags, links must be https. Answers the package as GET /registry/packages/{name} does.
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 300 }
                readme: { type: string }
                categories: { type: array, maxItems: 3, items: { type: string } }
                tags: { type: array, maxItems: 8, items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,23}$" } }
                homepage: { type: string, format: uri }
                source: { type: string, format: uri }
                license: { type: string, description: SPDX identifier or expression }
      responses:
        "200": { description: The package, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}/icon:
    put:
      tags: [registry]
      summary: Set the package icon (its author; PNG or WebP, at most 128 KiB)
      description: SVG and other formats are refused, since they can carry scripts.
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      requestBody: { $ref: "#/components/requestBodies/Image" }
      responses:
        "200": { description: Set, content: { application/json: { schema: { type: object, properties: { icon: { type: string, description: Media id } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    delete:
      tags: [registry]
      summary: Remove the package icon (its author)
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      responses:
        "204": { description: Removed }
  /registry/packages/{name}/screenshots:
    post:
      tags: [registry]
      summary: Add a screenshot (its author; PNG or WebP, at most 1 MiB, at most 6)
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      requestBody: { $ref: "#/components/requestBodies/Image" }
      responses:
        "201": { description: The screenshots now, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Screenshot" } } } } }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}/screenshots/{id}:
    delete:
      tags: [registry]
      summary: Remove a screenshot (its author)
      parameters: [{ $ref: "#/components/parameters/PackageName" }, { $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /registry/media/{id}:
    get:
      tags: [registry]
      security: []
      summary: An icon or screenshot
      description: Served as image/png or image/webp (sniffed again on the way out) with a sandboxing content security policy; cacheable forever, since ids are content hashes.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: The image, content: { image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
  /registry/installs:
    post:
      tags: [registry]
      security: []
      summary: Count an anonymous install, uninstall or still-installed heartbeat
      description: "`daemon` is an opaque id the daemon derives for each package (so packages can't be linked to one daemon); the hub hashes it again. Each event counts once per daemon per package per day. `downloads` counts installs, `installs` the daemons that sent an install or heartbeat in the last 45 days and no uninstall since. Rate-limited per address."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, event, daemon]
              properties:
                name: { type: string }
                version: { type: string }
                event: { type: string, enum: [install, uninstall, heartbeat] }
                daemon: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" }
      responses:
        "202": { description: Received, content: { application/json: { schema: { type: object, properties: { counted: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /registry/advisories:
    post:
      tags: [registry]
      security: []
      summary: Whether installed versions were yanked or their packages delisted
      description: Daemons ask about their installed modules (at most 200) periodically and warn the person, with the reason, when a version was yanked or a package removed from the marketplace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modules: { type: array, maxItems: 200, items: { type: object, required: [name, version], properties: { name: { type: string }, version: { type: string } } } }
      responses:
        "200": { description: One advisory per known-shaped name, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Advisory" } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}/reviews:
    get:
      tags: [registry]
      security: []
      summary: Ratings and reviews, written ones first, newest first
      parameters:
        - { $ref: "#/components/parameters/PackageName" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                required: [average, count, histogram, items]
                properties:
                  average: { type: number }
                  count: { type: integer }
                  histogram: { type: array, items: { type: integer }, minItems: 5, maxItems: 5, description: Ratings of 1 to 5 stars }
                  items: { type: array, items: { $ref: "#/components/schemas/Review" } }
        "404": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}/reviews/mine:
    get:
      tags: [registry]
      summary: Your rating and review of a package
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      responses:
        "200": { description: Yours, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [registry]
      summary: Rate and optionally review a package, or change your rating (scope registry:review)
      description: One per account per package; a confirmed email address is needed and authors can't rate their own packages. Paired daemons can do this for their account. Rate-limited per account.
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string, maxLength: 2000, description: Plain text }
                version: { type: string, description: The version you used }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [registry]
      summary: Withdraw your rating and review
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      responses:
        "204": { description: Withdrawn }
        "404": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}/reviews/{id}/reply:
    post:
      tags: [registry]
      summary: Reply to a review as the package's author (an empty body removes the reply)
      parameters: [{ $ref: "#/components/parameters/PackageName" }, { $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { body: { type: string, maxLength: 2000 } } } } }
      responses:
        "200": { description: Replied, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /registry/packages/{name}/reports:
    post:
      tags: [registry]
      summary: Report a package or one of its versions to the hub's operators (scope registry:review)
      description: One open report per account per package; a confirmed email address is needed. `other` needs details. Malware reports email the operators. Rate-limited per account.
      parameters: [{ $ref: "#/components/parameters/PackageName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                version: { type: string }
                reason: { $ref: "#/components/schemas/ModerationReason" }
                details: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Reported, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /updates/{component}/{channel}/{platform}:
    get:
      tags: [updates]
      security: []
      summary: The newest signed release
      description: Pass `current` to get 204 when there's nothing newer. Clients must verify the signature with their built-in release key.
      parameters:
        - { name: component, in: path, required: true, schema: { type: string, enum: [daemon, desktop, android, hub] } }
        - { name: channel, in: path, required: true, schema: { type: string } }
        - { name: platform, in: path, required: true, schema: { type: string } }
        - { name: current, in: query, schema: { type: string } }
      responses:
        "200":
          description: Release
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  payload: { type: string, description: Base64 of the signed ReleasePayload JSON }
                  signature: { type: string }
                  publishedAt: { type: string, format: date-time }
        "204": { description: Up to date }
        "404": { $ref: "#/components/responses/Error" }
  /releases:
    post:
      tags: [updates]
      summary: Publish a release signed with the hub's release key (admins)
      requestBody: { $ref: "#/components/requestBodies/Signed" }
      responses:
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/ReleasePayload" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/stats:
    get:
      tags: [admin]
      summary: Hub overview for the operator console (signed-in hub admins only)
      responses:
        "200": { description: Counts, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStats" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/accounts:
    get:
      tags: [admin]
      summary: Accounts on this hub, newest first, optionally searched by email or name (hub admins only)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: A page of accounts
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/AdminAccount" } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/accounts/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      tags: [admin]
      summary: Delete an account and everything the hub keeps for it (hub admins only; not your own)
      description: Removes sessions, devices, API keys, sync blobs, passkeys, the registry author handle and organisation memberships, and organisations left without members. Published registry packages stay. The account is told by email.
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/accounts/{id}/disable:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Switch an account off (hub admins only; not your own)
      description: Ends its sessions, revokes its devices and API keys, drops its daemons' relay connections and refuses sign-in until it is switched on again. The account is told by email.
      responses:
        "200": { description: Switched off, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/accounts/{id}/enable:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Switch an account back on (devices and keys stay revoked)
      responses:
        "200": { description: Switched on, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/reports:
    get:
      tags: [admin]
      summary: The marketplace reports queue (hub admins only); open malware reports first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, all], default: open } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: A page of reports
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/AdminReport" } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/reports/{id}/resolve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Resolve a report (hub admins only)
      description: "`dismiss` closes it. `yank` yanks the reported version (or `version`). `delist` removes the package from the marketplace and closes its other open reports. `ban` bans the author: the handle and key stay as a tombstone, all their packages are delisted and they can't publish. The reason defaults to the report's; the author is told by email."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [dismiss, yank, delist, ban] }
                reason: { $ref: "#/components/schemas/ModerationReason" }
                note: { type: string, maxLength: 500, description: Shown to daemons and the author }
                version: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/registry/packages/{name}/delist:
    parameters: [{ $ref: "#/components/parameters/PackageName" }]
    post:
      tags: [admin]
      summary: Remove a package from the marketplace (hub admins only)
      requestBody: { $ref: "#/components/requestBodies/Moderation" }
      responses:
        "204": { description: Delisted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/registry/packages/{name}/relist:
    parameters: [{ $ref: "#/components/parameters/PackageName" }]
    post:
      tags: [admin]
      summary: List a delisted package again (hub admins only)
      responses:
        "204": { description: Listed }
        "404": { $ref: "#/components/responses/Error" }
  /admin/registry/packages/{name}/versions/{version}/yank:
    parameters: [{ $ref: "#/components/parameters/PackageName" }, { name: version, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin]
      summary: Yank a version with a reason (hub admins only)
      requestBody: { $ref: "#/components/requestBodies/Moderation" }
      responses:
        "204": { description: Yanked }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/registry/packages/{name}/versions/{version}/unyank:
    parameters: [{ $ref: "#/components/parameters/PackageName" }, { name: version, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin]
      summary: Undo an operator's yank (hub admins only; an author's own yank stays)
      responses:
        "204": { description: Restored }
        "404": { $ref: "#/components/responses/Error" }
  /admin/registry/authors/{handle}/ban:
    parameters: [{ name: handle, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin]
      summary: Ban an author (hub admins only)
      description: The handle and key are kept as a tombstone so nobody can register the handle, and daemons that pinned the key refuse anyone else's builds. All their packages are delisted with the reason; they can't publish, rotate their key or edit listings.
      requestBody: { $ref: "#/components/requestBodies/Moderation" }
      responses:
        "204": { description: Banned }
        "404": { $ref: "#/components/responses/Error" }
  /admin/registry/authors/{handle}/unban:
    parameters: [{ name: handle, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin]
      summary: Lift a ban (hub admins only); packages stay delisted until listed again one by one
      responses:
        "204": { description: Lifted }
        "404": { $ref: "#/components/responses/Error" }
  /admin/registry/authors/{handle}/verify:
    parameters: [{ name: handle, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin]
      summary: Give or take an author's verified badge (hub admins only)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [verified], properties: { verified: { type: boolean } } } } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sessions/2fa:
    post:
      tags: [accounts]
      security: []
      summary: Finish a password sign-in with a code from the authenticator app or a recovery code
      description: The challenge lasts 5 minutes and takes 5 wrong codes; each code works once. Passkey sign-in needs no second step.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [challenge, code], properties: { challenge: { type: string }, code: { type: string } } }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { type: object, required: [token, account], properties: { token: { type: string }, account: { $ref: "#/components/schemas/Account" } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/2fa:
    get:
      tags: [accounts]
      summary: Whether two-factor sign-in is on (signed-in person)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [enabled, recoveryCodesLeft], properties: { enabled: { type: boolean }, recoveryCodesLeft: { type: integer } } }
  /me/2fa/setup:
    post:
      tags: [accounts]
      summary: Start setting up two-factor sign-in (needs the password); answers the secret and an otpauth:// link
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [secret, uri], properties: { secret: { type: string }, uri: { type: string } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/2fa/enable:
    post:
      tags: [accounts]
      summary: Turn two-factor sign-in on with a code from the app; answers ten recovery codes, shown once
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        "200": { description: "On", content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryCodes" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /me/2fa/disable:
    post:
      tags: [accounts]
      summary: Turn two-factor sign-in off (needs the password and a code or recovery code)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password, code], properties: { password: { type: string }, code: { type: string } } } } }
      responses:
        "204": { description: "Off" }
        "403": { $ref: "#/components/responses/Error" }
  /me/2fa/recovery-codes:
    post:
      tags: [accounts]
      summary: Replace the recovery codes (needs the password and a code)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password, code], properties: { password: { type: string }, code: { type: string } } } } }
      responses:
        "200": { description: New codes, content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryCodes" } } } }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    PackageName: { name: name, in: path, required: true, schema: { type: string }, description: "handle/module, slash escaped as %2F" }
  requestBodies:
    Token:
      required: true
      content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
    Signed:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [payload, signature]
            properties:
              payload: { type: string, description: Base64 of the exact JSON bytes that were signed }
              signature: { type: string, description: Base64 ed25519 signature over those bytes }
    Image:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: string, description: Base64 PNG or WebP }
              caption: { type: string, maxLength: 140, description: Screenshots only }
    Moderation:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: { $ref: "#/components/schemas/ModerationReason" }
              note: { type: string, maxLength: 500, description: Shown to daemons and the author }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { type: object, required: [error], properties: { error: { type: string } } } } }
    Status:
      description: OK
      content: { application/json: { schema: { type: object, additionalProperties: true } } }
  schemas:
    TwoFactorChallenge:
      type: object
      required: [twoFactor, challenge]
      properties:
        twoFactor: { type: boolean, enum: [true] }
        challenge: { type: string }
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: { type: array, items: { type: string } }
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    PasskeyCeremony:
      type: object
      required: [ceremony, options]
      properties:
        ceremony: { type: string, description: Send back with the finish call; single use, five minutes }
        options: { type: object, description: "WebAuthn options: { publicKey: {...} } with base64url challenge and ids" }
    Account:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        verified: { type: boolean }
        admin: { type: boolean }
        createdAt: { type: string, format: date-time }
        disabled: { type: boolean, description: Switched off by an operator }
    AdminAccount:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          properties:
            devices: { type: integer, description: Paired devices that aren't revoked }
            lastSignInAt: { type: string, description: "RFC 3339; empty when never recorded" }
    AdminStats:
      type: object
      properties:
        accounts: { type: integer }
        verified: { type: integer }
        admins: { type: integer }
        disabled: { type: integer }
        devices: { type: integer }
        daemons: { type: integer }
        daemonsOnline: { type: integer, description: Daemons connected to the relay right now }
        orgs: { type: integer }
        syncBlobs: { type: integer }
        syncBytes: { type: integer }
        packages: { type: integer }
        releases: { type: integer }
        openReports: { type: integer, description: Marketplace reports waiting for an operator }
        delisted: { type: integer }
    Org:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        createdAt: { type: string, format: date-time }
    Member:
      type: object
      properties:
        accountId: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        joinedAt: { type: string, format: date-time }
    Device:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [daemon, client] }
        publicKey: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        online: { type: boolean }
    Blob:
      type: object
      properties:
        key: { type: string }
        version: { type: integer }
        data: { type: string }
        updatedAt: { type: string, format: date-time }
    HubKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    Package:
      type: object
      properties:
        name: { type: string }
        owner: { type: string }
        description: { type: string }
        homepage: { type: string }
        source: { type: string }
        license: { type: string }
        latest: { type: string }
        downloads: { type: integer, description: Installs ever, one per daemon per day }
        installs: { type: integer, description: Daemons that have it now }
        rating: { type: number, description: Average of 1 to 5; 0 without ratings }
        ratingCount: { type: integer }
        categories: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        icon: { type: string, description: "Media id for GET /registry/media/{id}" }
        verified: { type: boolean, description: The author is verified by the hub's operators }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        delisted: { type: boolean }
        delistReason: { $ref: "#/components/schemas/ModerationReason" }
        delistNote: { type: string }
    PackageVersion:
      type: object
      properties:
        version: { type: string }
        payload: { type: string, description: Base64 of the signed VersionPayload JSON }
        signature: { type: string }
        yanked: { type: boolean }
        yankedBy: { type: string, enum: [author, operator] }
        yankReason: { $ref: "#/components/schemas/ModerationReason" }
        yankNote: { type: string }
        createdAt: { type: string, format: date-time }
    ModerationReason:
      type: string
      enum: [malware, broken, spam, impersonation, license, other]
    Category:
      type: object
      required: [id, label, count]
      properties:
        id: { type: string }
        label: { type: string, description: English; clients translate by id }
        count: { type: integer }
    Screenshot:
      type: object
      required: [id]
      properties:
        id: { type: string }
        caption: { type: string }
    Advisory:
      type: object
      required: [name, version, status]
      properties:
        name: { type: string }
        version: { type: string }
        status: { type: string, enum: [ok, yanked, delisted, missing] }
        by: { type: string, enum: [author, operator] }
        reason: { $ref: "#/components/schemas/ModerationReason" }
        note: { type: string }
        latest: { type: string }
    Review:
      type: object
      required: [id, author, rating, body, createdAt, updatedAt]
      properties:
        id: { type: string }
        author: { type: string, description: The reviewer's display name; may be empty. Never an email address }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reply: { type: string, description: The author's reply }
        replyAt: { type: string }
    AdminReport:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        reason: { $ref: "#/components/schemas/ModerationReason" }
        details: { type: string }
        status: { type: string, enum: [open, dismissed, actioned] }
        action: { type: string, enum: [dismiss, yank, delist, ban] }
        note: { type: string }
        reporter: { type: string, description: The reporter's email; empty when the account is gone }
        resolvedBy: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string }
        owner: { type: string }
        delisted: { type: boolean }
        authorState: { type: string, enum: [ok, verified, banned] }
        openReports: { type: integer, description: Open reports about the same package }
    ReleasePayload:
      type: object
      properties:
        component: { type: string }
        channel: { type: string }
        platform: { type: string }
        version: { type: string }
        url: { type: string }
        sha256: { type: string }
        notes: { type: string }
