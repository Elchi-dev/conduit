[package]
name = "conduit-desktop"
version = "0.1.0"
description = "Conduit desktop and mobile shell"
edition = "2021"
publish = false

[lib]
name = "conduit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
