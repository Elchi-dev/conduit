{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conduit-hub.secretName" . }}
  labels: {{- include "conduit-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  RESEND_KEY: {{ .Values.secrets.resendKey | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
